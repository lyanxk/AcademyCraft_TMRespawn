plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = rootProject.name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}
dependencies {
    // JEI discovers this optional plugin. The base mod does not bundle or require JEI.
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.70.0.469'
    if (providers.gradleProperty('integrationMods').orElse('false').get().toBoolean()) {
        localRuntime 'mezz.jei:jei-1.21.1-neoforge:19.70.0.469'
    }
    // Original about.conf uses HOCON; bundle its parser for production as well as development.
    jarJar(implementation('com.typesafe:config')) {
        version {
            strictly '[1.4.3,1.5)'
            prefer '1.4.3'
        }
    }
    // 1.21.1 dev runs do not load ordinary Java libraries from the mod path automatically.
    additionalRuntimeClasspath 'com.typesafe:config:1.4.3'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    from('COPYING', 'LICENSE.md', 'NOTICE.txt', 'upstream-lock.json')
    manifest {
        attributes([
            'Specification-Title': mod_name,
            'Specification-Vendor': 'Lambda Innovation / NeoForge port contributors',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'AcademyCraft contributors'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
